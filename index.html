<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextBestOffer - Recomendador bancário com IA</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./src/main.js"></script>
</head>
<body>
    <header class="topbar">
        <div>
            <h1>NextBestOffer</h1>
            <p>Recomendação de produtos bancários com rede neural no navegador, respeitando suitability e renda mínima</p>
        </div>
        <span class="badge">Dados fictícios</span>
    </header>

    <main class="layout">
        <section class="card">
            <h2>Cliente</h2>
            <label for="customer-select" class="sr-only">Selecione o cliente</label>
            <select id="customer-select"></select>
            <div id="customer-profile"></div>
        </section>

        <section class="card">
            <div class="card-header">
                <h2>Próximas melhores ofertas</h2>
            </div>
            <p id="recommendation-source" class="muted"></p>
            <ol id="recommendations" class="offers"></ol>

            <details class="blocked">
                <summary>Produtos bloqueados por regra de negócio</summary>
                <ul id="blocked-products"></ul>
            </details>
        </section>

        <section class="card training">
            <div class="card-header">
                <h2>Modelo</h2>
                <button id="retrain-button" type="button" class="secondary">Retreinar</button>
            </div>
            <div class="progress"><div id="training-bar"></div></div>
            <p id="training-status" class="muted"></p>
        </section>
    </main>
</body>
</html>
